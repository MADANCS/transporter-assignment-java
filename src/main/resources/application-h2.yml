
# ─────────────────────────────────────────────────────────────────────────────
# Profile: h2
# Runs the application with an in-memory H2 database.
# Use this when PostgreSQL is not available locally.
#
# Activate with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# or set  spring.profiles.active=h2  in application.yml
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:transporter_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Enable the H2 web console at /h2-console (handy for inspection)
  h2:
    console:
      enabled: true
      path: /h2-console
