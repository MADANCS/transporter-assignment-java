spring:
  datasource:
    # Render injects DATABASE_URL as postgres://user:pass@host:port/db
    # We convert it to jdbc:postgresql:// format via environment variable
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/transporter_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgre}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: com.transporter.assignment.config.CustomPostgreSQLDialect
        format_sql: false

server:
  # Render injects PORT environment variable
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.transporter: INFO
    org.hibernate.SQL: WARN
