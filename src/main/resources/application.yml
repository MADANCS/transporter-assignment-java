spring:
  datasource:
    # Set by RenderDatabaseUrlProcessor or system properties
    url: ${SPRING_DATASOURCE_URL:${spring.datasource.url:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/transporter_db}}}
    username: ${spring.datasource.username:${DB_USERNAME:postgres}}
    password: ${spring.datasource.password:${DB_PASSWORD:postgre}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: com.transporter.assignment.config.CustomPostgreSQLDialect
        format_sql: false

server:
  # Render injects PORT environment variable
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.transporter: INFO
    org.hibernate.SQL: WARN
