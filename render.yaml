databases:
  - name: transporter-db
    databaseName: transporter_db
    user: postgres
    plan: free

services:
  - type: web
    name: transporter-assignment-api
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: transporter-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: transporter-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: transporter-db
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: default
    healthCheckPath: /api-docs
